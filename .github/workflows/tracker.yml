name: Coursera Price Tracker

on:
  schedule:
    - cron: '0 15 * * *'  # cada dia a las 9am CDMX (UTC-6)
  workflow_dispatch:  # para correrlo manualmente tambien

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Run tracker
        run: python Coursera_pricing_tracker.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update price data"
          git push
